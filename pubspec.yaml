name: lkw_almanya

description: Almanya kamyon ve otomobil navigasyon uygulaması

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Depolama ve Preferences
  shared_preferences: ^2.5.5
  path_provider: ^2.1.0

  # Ses işleme
  speech_to_text: ^7.4.0
  flutter_tts: ^4.2.5

  # Konfigürasyon
  flutter_dotenv: ^5.2.1

  # Harita ve Konum
  latlong2: ^0.9.0
  geolocator: ^10.1.1
  flutter_map: ^6.0.0

  # Ağ ve HTTP
  http: ^1.2.0

  # Sistem
  wakelock_plus: ^1.2.10
  share_plus: ^10.0.0

  # State Management
  provider: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - .env