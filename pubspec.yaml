name: lkw_almanya

description: Almanya kamyon ve otomobil navigasyon uygulaması

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  shared_preferences: ^2.5.5
  speech_to_text: ^7.4.0
  flutter_tts: ^4.2.5
  flutter_dotenv: ^5.2.1
  flutter_map: ^5.0.0
  latlong2: ^0.9.0
  geolocator: ^10.1.1
  http: ^1.2.0
  wakelock_plus: ^1.2.10
  share_plus: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - .env